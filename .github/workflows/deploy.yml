name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be enabled on the repo (Settings > Pages >
      # Source: GitHub Actions). Auto-enabling from here needs a token
      # permission the workflow does not reliably have, and turns a
      # setup step into a hard build failure.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site is a static folder with no build step; publish it as-is.
      - name: Upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
